<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The Nightingale mark, alone: no badge, no padding, run to the canvas edge.

    The fill FLIPS with the browser's theme. A near-white mark on transparency
    is invisible against a light tab strip, which is most people in light mode —
    so "no background" only actually works if the mark itself adapts. Browsers
    that support SVG favicons take this one; favicon.png is the fallback.

    The shape is `logo-mark.png`'s alpha used as a mask, so it stays pixel-exact
    to the source. Regenerate both from that file, never by hand.
  -->
  <style>
    .mark { fill: #0a0a0a; }
    @media (prefers-color-scheme: dark) { .mark { fill: #fafafa; } }
  </style>
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <image x="142" y="0" width="228" height="512"
             href="data:image/png;base64,"/>
    </mask>
  </defs>
  <rect class="mark" width="512" height="512" mask="url(#m)"/>
</svg>
